<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscripción al torneo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form action="#" method="get">
      <h1>Inscripción al torneo</h1>

      <fieldset>
        <legend>Datos personales</legend>

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required />

        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" min="16" />

        <label for="nacimiento">Fecha de nacimiento</label>
        <input type="date" id="nacimiento" name="nacimiento" />
      </fieldset>

      <fieldset>
        <legend>Cuenta</legend>

        <label for="nickname">Nombre del jugador (nickname)</label>
        <input type="text" id="nickname" name="nickname" minlength="3" maxlength="15" required />

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required />
      </fieldset>

      <fieldset>
        <legend>Torneo</legend>

        <label for="juego">Videojuego</label>
        <select id="juego" name="juego">
          <option value="">Selecciona un juego</option>
          <option value="lol">League of Legends</option>
          <option value="valorant">Valorant</option>
          <option value="fortnite">Fortnite</option>
          <option value="cs2">Counter-Strike 2</option>
        </select>

        <p>Plataforma</p>
        <div class="opciones">
          <label><input type="radio" name="plataforma" value="pc" /> PC</label>
          <label><input type="radio" name="plataforma" value="playstation" /> PlayStation</label>
          <label><input type="radio" name="plataforma" value="xbox" /> Xbox</label>
        </div>

        <p>Disponibilidad horaria</p>
        <div class="opciones">
          <label><input type="checkbox" name="disponibilidad" value="manana" /> Mañana</label>
          <label><input type="checkbox" name="disponibilidad" value="tarde" /> Tarde</label>
          <label><input type="checkbox" name="disponibilidad" value="noche" /> Noche</label>
        </div>
      </fieldset>

      <label for="comentarios">Comentarios adicionales</label>
      <textarea id="comentarios" name="comentarios" rows="4"></textarea>

      <label class="normas">
        <input type="checkbox" id="normas" name="normas" required />
        Acepto las <a href="normas.html">normas</a>
      </label>

      <div class="botones">
        <button type="submit">Inscribirme</button>
        <button type="reset">Limpiar</button>
      </div>
    </form>
  </body>
</html>
